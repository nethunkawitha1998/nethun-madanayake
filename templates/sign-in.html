{% extends "base.html" %}
{% block title %}Sign In{% endblock %}

{% block content %}
<section class="auth-section">
    <div class="auth-card">
        <h2>Sign In</h2>
        <p class="auth-sub">Sign in to upload a dataset and view analysis results.</p>
        <form method="POST" action="{{ url_for('sign_in') }}" class="auth-form">
            <label for="email">Email address</label>
            <input type="email" id="email" name="email" required autofocus>

            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>

            <button type="submit" class="btn btn-primary btn-block">Sign In</button>
        </form>
        <p class="auth-switch">Don't have an account? <a href="{{ url_for('sign_up') }}">Sign up</a></p>
    </div>
</section>
{% endblock %}
