<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="../styles/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <header class="site-header" id="site-header"></header>

    <main class="page-content container">
        <section class="auth-section">
            <div class="auth-card">
                <h2>Create an Account</h2>
                <p class="auth-sub">Create an account to upload questionnaire data and view results.</p>
                <form id="signup-form" class="auth-form">
                    <label for="full_name">Full name</label>
                    <input type="text" id="full_name" name="full_name" required autofocus>

                    <label for="email">Email address</label>
                    <input type="email" id="email" name="email" required>

                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" minlength="8" required>
                    <p class="field-hint">At least 8 characters.</p>

                    <label for="confirm_password">Confirm password</label>
                    <input type="password" id="confirm_password" name="confirm_password" minlength="8" required>

                    <button type="submit" class="btn btn-primary btn-block">Sign Up</button>
                </form>
                <p class="auth-switch">Already have an account? <a href="sign-In.html">Sign in</a></p>
                <p class="field-hint" style="margin-top:16px;">
                    Note: this is a static, front-end-only demo. Accounts are stored in your own
                    browser (localStorage) and are not a substitute for real authentication.
                </p>
            </div>
        </section>
    </main>

    <footer class="site-footer" id="site-footer"></footer>

    <script src="../styles/main.js"></script>
    <script>
        renderHeaderFooter("../");

        document.getElementById("signup-form").addEventListener("submit", function (e) {
            e.preventDefault();
            const fullName = document.getElementById("full_name").value.trim();
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;
            const confirm = document.getElementById("confirm_password").value;

            if (!fullName || !email || !password) {
                showFlash("All fields are required.", "danger");
                return;
            }
            if (password !== confirm) {
                showFlash("Passwords do not match.", "danger");
                return;
            }
            if (password.length < 8) {
                showFlash("Password must be at least 8 characters long.", "danger");
                return;
            }

            const result = Auth.signUp(fullName, email, password);
            if (!result.ok) {
                showFlash(result.error, "danger");
                return;
            }
            showFlash("Account created successfully. Please sign in.", "success");
            window.location.href = "sign-In.html";
        });
    </script>
</body>
</html>
