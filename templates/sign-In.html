<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In</title>
    <link rel="stylesheet" href="../styles/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <header class="site-header" id="site-header"></header>

    <main class="page-content container">
        <section class="auth-section">
            <div class="auth-card">
                <h2>Sign In</h2>
                <p class="auth-sub">Sign in to upload a dataset and view analysis results.</p>
                <form id="signin-form" class="auth-form">
                    <label for="email">Email address</label>
                    <input type="email" id="email" name="email" required autofocus>

                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>

                    <button type="submit" class="btn btn-primary btn-block">Sign In</button>
                </form>
                <p class="auth-switch">Don't have an account? <a href="sign-Up.html">Sign up</a></p>
                <p class="field-hint" style="margin-top:16px;">
                    Note: this is a static, front-end-only demo. Accounts are stored in your own
                    browser and are not a substitute for real authentication.
                </p>
            </div>
        </section>
    </main>

    <footer class="site-footer" id="site-footer"></footer>

    <script src="../styles/main.js"></script>
    <script>
        renderHeaderFooter("../");

        document.getElementById("signin-form").addEventListener("submit", function (e) {
            e.preventDefault();
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;
            const result = Auth.signIn(email, password);
            if (!result.ok) {
                showFlash(result.error, "danger");
                return;
            }
            showFlash("Welcome back!", "success");
            window.location.href = "analysis.html";
        });
    </script>
</body>
</html>
